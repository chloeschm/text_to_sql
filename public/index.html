<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query Tool</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>

<body>
    <div id="upload-section">
        <h1>Upload a CSV File to Query it!</h1>
        <form action="/api/upload" method="post" enctype="multipart/form-data" id="upload-form">
            <input type="file" name="csvFile" accept=".csv">
            <input type="text" name="tableName" placeholder="Name your table">
            <button type="submit">Upload</button>
        </form>
    </div>

    <div id="query-section">
        <h2>Query Your Data</h2>
        <select name="tableName" id="table-select">
            <option value="">Select a table</option>
        </select>

        <form action="/api/query" method="post" id="query-form">
            <input type="text" name="question" placeholder="Type your question here">
            <button type="submit">Submit to ask</button>
        </form>

        <div id="result-section">
            <h3>Results</h3>
            <p id="results-text">
            <table>
                <thead>
                    <tr id="results-header">
                    </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
            </p>
        </div>
    </div>
</body>

</html>
